format_version: 1
name: OSC Cues
revision: 1
rules:
  - id: cue-1
    name: Cue 1
    armed: true
    trigger: { type: osc, address: /cue/1, arg_equals: 1 }
    actions:
      - { id: power, type: control.osc, device: projector-1, address: /projector/1/power, args: [1] }
      - { id: confirm, type: notify.operator, message: Cue 1 fired }
  - id: any-mute
    name: Any channel mute
    armed: true
    trigger: { type: osc, address: /channel/*/mute, min_args: 1 }
    actions:
      - { id: log, type: log.incident, severity: info, message: a channel was muted }
