[package]
name = "tpt-app-av-automation-cli"
description = "Command-line interface for TPT AV Automation: validate, simulate and run rule packs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "tpt-av-automation"
path = "src/main.rs"

[dependencies]
tpt-app-av-automation-core = { workspace = true }
tpt-app-av-automation-model = { workspace = true }
tpt-app-av-automation-triggers = { workspace = true }
tpt-app-av-automation-conditions = { workspace = true }
tpt-app-av-automation-actions = { workspace = true }
tpt-app-av-automation-devices = { workspace = true }
tpt-app-av-automation-engine = { workspace = true }
tpt-app-av-automation-report = { workspace = true }
tpt-app-av-automation-service = { workspace = true }
tpt-app-av-automation-test = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tpt-av-control-osc = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }