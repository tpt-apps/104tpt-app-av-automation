# The smallest useful pack: an OSC message from a control surface runs a cue.
format_version: 1
name: Hello
revision: 1
rules:
  - id: cue-1
    name: Cue 1
    armed: false
    trigger:
      type: osc
      address: /cue/1
      arg_equals: 1
    actions:
      - id: projector-on
        type: control.osc
        device: projector-1
        address: /projector/1/power
        args: [1]
      - id: confirm
        type: notify.operator
        message: Cue 1 fired
