# Device registry for the example packs. Network devices are reached over UDP; `virtual` devices
# record commands in memory and are handy for rehearsing a pack without hardware.
devices:
  - id: lighting-rack
    name: Lighting Rack
    kind: lighting
    protocol: artnet
    address: 127.0.0.1:6454
    heartbeat_ms: 15000
    scenes:
      house-to-half: { universe: 1, start_channel: 0, values: [128, 128, 128, 128] }
  - id: projector-1
    name: Projector 1
    kind: display
    protocol: osc
    address: 127.0.0.1:9000
    heartbeat_ms: 15000
  - id: audio-matrix
    name: Audio Matrix
    kind: audio
    protocol: virtual
  - id: switcher
    name: Video Switcher
    kind: switcher
    protocol: osc
    address: 127.0.0.1:9001
  - id: media-server
    name: Media Server
    kind: media
    protocol: media
    address: 127.0.0.1:9002
    media:
      video: /media/video/{source}/{operation}
      audio: /media/audio/{from}/{to}/{operation}
  - id: display-1
    name: Main Display
    kind: display
    protocol: virtual
  # Serial DMX512-A adapter. `address` is the serial port name, not a host:port. A serial port is one
  # universe, so scenes must use universe 1. Commented out so the example file validates on a
  # machine with no such adapter; uncomment and set `address` to your port to use it.
  # - id: house-lights
  #   name: House Lights
  #   kind: lighting
  #   protocol: dmx512
  #   address: "COM3"
  #   scenes:
  #     house-to-half: { universe: 1, start_channel: 0, values: [128, 128, 128, 128] }
