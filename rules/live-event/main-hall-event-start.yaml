# Weekday evening cue for the main hall (spec §9). Rules load disarmed: arm one explicitly
# (desktop UI, `POST /rules/:id/arm`, or `armed: true` here) before it may send anything.
format_version: 1
name: Main Hall
description: Standard main hall show-start automation
revision: 1
rules:
  - id: event-start
    name: Main Hall - Event Start
    version: 1
    armed: false
    tags: [show, lighting]
    trigger:
      type: schedule
      at: "18:55"
      days: [mon, tue, wed, thu, fri]
    conditions:
      - id: projector-ready
        type: device_health
        device: projector-1
        equals: online
        description: Only start the show if the projector is reachable
    actions:
      - id: house-to-half
        type: control.dmx_scene
        device: lighting-rack
        scene: house-to-half
        fade_ms: 3000
      - id: projector-on
        type: control.osc
        device: projector-1
        address: /projector/1/power
        args: [1]
      - id: pa-route
        type: media.audio_route
        device: audio-matrix
        from: playback-1
        to: main-pa
    policy:
      on_failure: continue_chain
      timeout_ms: 10000
