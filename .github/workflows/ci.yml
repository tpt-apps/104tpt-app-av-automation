name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux is the reference platform for the headless service and the only platform where
  # coverage-guided fuzzing can run: Rust ships no AddressSanitizer runtime for
  # `x86_64-pc-windows-msvc`, so `cargo fuzz` cannot link there (spec §11, §18.5).
  linux:
    name: Linux (stable)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-av-control (path dependency)
        shell: bash
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-av-control.git ../tpt-av-control
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install ALSA headers (midir)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Spec §11: the service must run headless on Linux, so the systemd unit is
      # smoke-tested for syntax rather than merely committed.
      - name: Validate systemd unit
        run: systemd-analyze verify scripts/tpt-av-automation.service

      - name: Test
        run: cargo test --workspace --locked

  fuzz:
    name: Fuzz (nightly, ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-av-control (path dependency)
        shell: bash
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-av-control.git ../tpt-av-control
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Install ALSA headers (midir)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Build fuzz targets
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

      # A short budget per target: enough to catch a shallow panic on every push, while
      # the long-running campaigns are the separate fuzz-nightly job.
      - name: Fuzz rule-pack parser
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu rule-pack -- -max_total_time=120 -rss_limit_mb=4096

      - name: Fuzz inbound OSC
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu inbound-osc -- -max_total_time=120 -rss_limit_mb=4096

      - name: Fuzz inbound MIDI
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu inbound-midi -- -max_total_time=120 -rss_limit_mb=4096

      - name: Fuzz inbound Art-Net/sACN
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu inbound-dmx -- -max_total_time=120 -rss_limit_mb=4096

      - name: Fuzz local API requests
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu api-request -- -max_total_time=120 -rss_limit_mb=4096

      # A crash leaves an artifact; surface it in the run log and as a downloadable file.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore

  windows:
    name: Windows (stable)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-av-control (path dependency)
        shell: bash
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-av-control.git ../tpt-av-control
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      # Confirms the packaged binary runs on a machine with no Rust toolchain (spec §24).
      - name: Package and smoke-test release
        shell: pwsh
        run: ./scripts/package-windows.ps1

  # The desktop shell has its own manifest (excluded from the workspace: it needs the
  # Tauri/WebView2 toolchain), so it is built and tested separately. Windows runners ship
  # WebView2, which is the reference platform for the app (spec §12).
  desktop:
    name: Desktop (Windows, Tauri)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-av-control (path dependency)
        shell: bash
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-av-control.git ../tpt-av-control
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tpt-app-av-automation-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format
        run: cargo fmt --manifest-path crates/tpt-app-av-automation-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path crates/tpt-app-av-automation-tauri/Cargo.toml --all-targets -- -D warnings

      - name: "Test (Rust: boot and embedded service)"
        run: cargo test --manifest-path crates/tpt-app-av-automation-tauri/Cargo.toml --locked

      - name: Test (UI helpers)
        run: node --test crates/tpt-app-av-automation-tauri/ui/test/format.test.js

  # Deeper fuzz campaigns for the parser surfaces that carry the most risk in a live show.
  # Runs on every CI trigger; each run takes about ten minutes.
  fuzz-nightly:
    name: Fuzz (nightly campaign)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-av-control (path dependency)
        shell: bash
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-av-control.git ../tpt-av-control
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Install ALSA headers (midir)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Long fuzz campaign
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu rule-pack -- -max_total_time=300 -rss_limit_mb=4096
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu api-request -- -max_total_time=300 -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-nightly
          path: fuzz/artifacts/
          if-no-files-found: ignore